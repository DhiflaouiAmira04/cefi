<div class="container mt-5">
  <div class="card mx-auto" style="max-width: 400px;">
    <div class="card-body">
      <h3>Définir votre mot de passe</h3>
      <p class="text-muted">Bienvenue chez CEFI ! Choisissez votre mot de passe pour activer votre compte.</p>
      
      <form (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label>Nouveau mot de passe</label>
          <input type="password" [(ngModel)]="password" name="password" class="form-control" required>
        </div>
        <div class="mb-3">
          <label>Confirmer le mot de passe</label>
          <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Activer mon compte</button>
      </form>
      
      <div *ngIf="message" class="alert alert-danger mt-3">{{ message }}</div>
    </div>
  </div>
</div>
