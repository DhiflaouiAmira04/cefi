<div style="padding: 20px; font-family: sans-serif;">
  <h2>🎓 Gestion des Diplômes</h2>

  <div style="margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 8px;">
    <input type="text" [(ngModel)]="nouveauDiplome" placeholder="Nom du diplôme..." 
           style="padding: 8px; width: 250px;">
    <button (click)="ajouterDiplome()" 
            style="padding: 8px 15px; background: green; color: white; border: none; cursor: pointer;">
      Ajouter
    </button>
  </div>

  <table border="1" style="width: 100%; border-collapse: collapse;">
    <thead style="background: #f4f4f4;">
      <tr>
        <th style="padding: 10px;">ID</th>
        <th style="padding: 10px;">Diplôme</th>
        <th style="padding: 10px;">Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let d of diplomes; let i = index">
        <td style="padding: 10px; text-align: center;">{{ d.id }}</td>
        <td style="padding: 10px;">{{ d.nom_diplome }}</td>
        <td style="padding: 10px; text-align: center;">
          <button (click)="supprimerDiplome(d.id, i)" 
                  style="background: red; color: white; border: none; padding: 5px 10px; cursor: pointer;">
            Supprimer
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
