<div class="container mt-5">
  <div class="card shadow-sm border-0">
    <div class="card-header d-flex justify-content-between align-items-center bg-white py-3">
      <h4 class="mb-0">Liste des enseignants</h4>
      
      <div class="search-box">
        <input type="text" [(ngModel)]="searchText" placeholder=" 🔍Rechercher ..." class="form-control form-control-sm">
      </div>

    </div>

    <div class="table-responsive">
      <table class="table mb-0">
        <thead>
          <tr>
            
            <th>CIN</th>
            <th>Nom & Prénom</th>
            <th>Date Naissance</th>
            <th>Email</th>
            <th>Spécialité</th>
            <th>Diplôme</th>
            
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let e of filteredEnseignants">
           
            <td>{{ e.CIN }}</td>
            <td class="fw-bold">{{ e.nom }}</td>
            <td class="text-muted">{{ e.datedenaissance | date:'dd/MM/yyyy' }}</td>
            <td>{{ e.email }}</td>
            <td>{{ e.specialite }}</td>
            <td><span class="badge-diplome">{{ e.diplome }}</span></td>

          </tr>
          <tr *ngIf="filteredEnseignants.length === 0">
            <td colspan="8" class="text-center py-4 text-muted">Aucun résultat trouvé.</td>
          </tr>
        </tbody>
      </table>
    </div>
    
  </div>
<button class="btn-print" routerLink="/printListe">
  <svg viewBox="0 0 24 24">
    <path d="M6 9V3h12v6H6zm12 2h2v6h-4v4H8v-4H4v-6h2v4h12v-4z"/>
  </svg>
  <span>Imprimer</span>
</button>
  
     
</div>
