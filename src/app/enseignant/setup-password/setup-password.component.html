<div class="setup-wrapper">
  <div class="setup-card">
    <div class="header">
      <i class="fas fa-user-check"></i>
      <h2>Activation Enseignant</h2>
      <p>Définissez votre mot de passe pour activer votre accès.</p>
    </div>

    <form (ngSubmit)="validerActivation()">
      <div class="input-group">
        <label>Nouveau mot de passe</label>
        <input type="password" [(ngModel)]="password" name="password" required placeholder="Entrez votre mot de passe">
      </div>

      <div class="input-group">
        <label>Confirmer le mot de passe</label>
        <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required placeholder="Répétez le mot de passe">
      </div>

      <button type="submit" [disabled]="loading || !password || password !== confirmPassword">
        {{ loading ? 'Activation en cours...' : 'Activer mon compte' }}
      </button>
    </form>
  </div>
</div>
