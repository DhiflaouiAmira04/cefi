<div class="container mt-5">
  <div class="card shadow border-0 custom-card">
    <div class="card-header bg-dark text-white d-flex align-items-center justify-content-between">
      <h4 class="mb-0 header-title">Modifier Enseignant</h4>
      <span class="header-label">✎ Édition</span>
    </div>
    <div class="card-body">
      <form (ngSubmit)="enregistrerModif()">
        <div class="mb-3">
          <label class="form-label">CIN</label>
          <input type="text" class="form-control" [(ngModel)]="enseignant.CIN" name="CIN">
        </div>
        <div class="mb-3">
          <label class="form-label">Nom & Prénom</label>
          <input type="text" class="form-control" [(ngModel)]="enseignant.nom" name="nom">
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" [(ngModel)]="enseignant.email" name="email">
        </div>
        <div class="mb-3">
        <label class="form-label custom-label">Date de naissance</label>
        <input type="date" 
                class="form-control custom-input" 
                [(ngModel)]="enseignant.datedenaissance" 
                name="datedenaissance">
        </div>

        <div class="mb-3">
          <label class="form-label">Spécialité</label>
          <input type="text" class="form-control" [(ngModel)]="enseignant.specialite" name="specialite">
        </div>
        <div class="mb-3">
          <label class="form-label">Diplôme</label>
          <input type="text" class="form-control" [(ngModel)]="enseignant.diplome" name="diplome">
        </div>
        <div class="d-flex mt-4">
          <button type="submit" class="btn btn-success me-2">Enregistrer</button>
          
        </div>
      </form>
    </div>
  </div>
</div>
