<div class="password-box">
  <h3>Modifier le mot de passe</h3>

  <form #pwForm="ngForm" (ngSubmit)="updatePassword()">
    
    <div class="field">
      <label>Ancien mot de passe :</label>
      <input type="password" name="old" [(ngModel)]="data.oldPassword" required>
    </div>

    <div class="field">
      <label>Nouveau mot de passe :</label>
      <input type="password" name="new" [(ngModel)]="data.newPassword" required minlength="6">
    </div>

    <div class="field">
      <label>Confirmer le nouveau mot de passe :</label>
      <input type="password" name="confirm" [(ngModel)]="data.confirmPassword" required>
    </div>

    <button type="submit" [disabled]="pwForm.invalid">Mettre à jour</button>

  </form>

  <p *ngIf="message" [style.color]="isError ? 'red' : 'green'">
    {{ message }}
  </p>
</div>
