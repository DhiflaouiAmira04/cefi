<div class="login-container">
  <h2>Nouveau mot de passe</h2>

  <form (ngSubmit)="updatePassword()">
    <input type="password" [(ngModel)]="newPassword" name="newPassword" 
           placeholder="Nouveau mot de passe" required minlength="8">
    
    <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" 
           placeholder="Confirmer le mot de passe" required>

    <div *ngIf="newPassword !== confirmPassword" class="error-text">
      Les mots de passe ne correspondent pas.
    </div>

    <button type="submit" [disabled]="newPassword !== confirmPassword || !newPassword">
      Mettre à jour le mot de passe
    </button>
  </form>
</div>
